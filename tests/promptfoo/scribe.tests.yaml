- description: captures durable API boundary decision
  vars:
    recentTurns: |-
      User: Can we add extra logging while debugging reloads?
      Assistant: Temporary logs are fine.
      User: The last run corrupted DECISIONS.md when two writes collided.
      Assistant: That sounds like a race.
      User: Decision: The API boundary owns input validation; internal services should never validate raw request payloads. Why: shared validation rules drifted and caused inconsistent behavior. Impact: all new endpoints must validate at the API boundary before calling service logic. Invalidate if we introduce a dedicated validation service used by all layers.
      Assistant: Noted.
      User: Let's rename the handler.
      Assistant: Renames are fine.
  assert:
    - type: javascript
      value: |
        let parsed;
        try {
          parsed = JSON.parse(output);
        } catch {
          return false;
        }
        const decisionText = parsed.decision.toLowerCase();
        return parsed.status === "decision"
          && typeof parsed.decision === "string"
          && decisionText.includes("api boundary")
          && (decisionText.includes("validation") || decisionText.includes("validate"))
          && parsed.why.trim().length > 0
          && parsed.impact.trim().length > 0
          && parsed.invalidation.trim().length > 0
          && parsed.decision.length < 220;

- description: collapses repeated rationale into one rule
  vars:
    recentTurns: |-
      User: We should avoid mixing persistence writes into business logic.
      Assistant: Agreed.
      User: It's caused validation to drift in the past.
      Assistant: Yes.
      User: Decision: All persistence writes must go through the data layer. Why: direct writes caused inconsistent validation. Impact: new features must route writes through data layer APIs. Invalidate if the data layer is replaced.
      Assistant: Noted.
  assert:
    - type: javascript
      value: |
        let parsed;
        try {
          parsed = JSON.parse(output);
        } catch {
          return false;
        }
        return parsed.status === "decision"
          && typeof parsed.decision === "string"
          && parsed.decision.toLowerCase().includes("data layer")
          && parsed.decision.length < 220
          && parsed.why.trim().length > 0
          && parsed.impact.trim().length > 0
          && parsed.invalidation.trim().length > 0;

