- description: enforces json-only output
  vars:
    recentTurns: |-
      User: Project policy: All changes must run npm test before commit. Why: avoid shipping untested changes. Impact: no commits without green tests. Invalidate if CI enforces pre-merge tests.
  assert:
    - type: javascript
      value: |
        const trimmed = output.trim();
        try {
          JSON.parse(trimmed);
        } catch {
          return false;
        }
        return !trimmed.includes("```") && !trimmed.startsWith("Note:") && !trimmed.startsWith("Summary:");
