- description: captures explicit project policy
  vars:
    recentTurns: |-
      User: Can we loosen the log size limits for testing?
      Assistant: We can revisit later.
      User: I just need a quick experiment.
      Assistant: Let's avoid changing defaults without a reason.
      User: Project policy: All changes must run npm test before commit. Why: avoids shipping untested changes. Impact: no commits without green tests. Invalidate if CI enforces pre-merge tests.
      Assistant: Noted.
      User: Also, keep responses short.
      Assistant: Acknowledged.
  assert:
    - type: javascript
      value: |
        let parsed;
        try {
          parsed = JSON.parse(output);
        } catch {
          return false;
        }
        return parsed.status === "decision"
          && typeof parsed.title === "string"
          && parsed.title.trim().length > 0
          && typeof parsed.type === "string"
          && parsed.type.length > 0
          && typeof parsed.decision === "string"
          && parsed.decision.includes("npm test")
          && parsed.decision.toLowerCase().includes("commit")
          && typeof parsed.why === "string"
          && parsed.why.trim().length > 0
          && typeof parsed.impact === "string"
          && parsed.impact.trim().length > 0
          && typeof parsed.invalidation === "string"
          && parsed.invalidation.trim().length > 0;

