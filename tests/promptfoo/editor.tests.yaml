- description: 10. No placeholder leakage
  vars:
    currentConventions: |-
      # Conventions

      ## Conflicts Requiring Review
      None.

      ## Active Decisions
      None.

      ## Superseded Decisions
      None.
    newCandidates: |-
      Candidate: {Short title} Use standard cache keys for all lookups.
      Candidate: {...} This is a placeholder example.
  assert:
    - type: javascript
      value: |
        let ok = !output.includes("{Short title}")
          && !output.includes("{...}");
        return ok;
    - type: llm-rubric
      value: |-
        PASS if the output either includes a clean rule about standard cache keys (without template tokens) or omits the placeholder candidate entirely.
        FAIL if the output includes template tokens or echoes the placeholder text.

        PASS example:
        ## Active Decisions
        - Use standard cache keys for all lookups.

        FAIL example:
        ## Active Decisions
        - {Short title} Use standard cache keys for all lookups.
        - {...} This is a placeholder example.

- description: 11. Inclusion gates filter local edits
  vars:
    currentConventions: |-
      # Conventions

      ## Conflicts Requiring Review
      None.

      ## Active Decisions
      - Use Node.js 22+.

      ## Superseded Decisions
      None.
    newCandidates: |-
      Candidate: The API boundary owns input validation; internal services must not validate raw request payloads.
      Candidate: Rename the helper to reduce clutter in this file.
  assert:
    - type: javascript
      value: |
        let ok = output.trim().startsWith("# Conventions");
        return ok;
    - type: llm-rubric
      value: |-
        PASS if Active Decisions includes the durable API boundary validation rule and does not include the local rename/clutter edit.
        FAIL if Active Decisions includes the local rename/clutter edit, or omits the API boundary validation rule.

        PASS example:
        ## Active Decisions
        - API boundary owns input validation; services must not validate raw payloads.

        FAIL example:
        ## Active Decisions
        - API boundary owns input validation; services must not validate raw payloads.
        - Rename the helper to reduce clutter.

- description: 12. Concise rule-form output
  vars:
    currentConventions: |-
      # Conventions

      ## Conflicts Requiring Review
      None.

      ## Active Decisions
      None.

      ## Superseded Decisions
      None.
    newCandidates: |-
      Candidate: Always validate outbound webhook payloads. Why: avoids 3rd-party rejection. Impact: add schema validation before sending. Invalidate if downstream vendor accepts unsigned payloads.
  assert:
    - type: javascript
      value: |
        let ok = output.trim().startsWith("# Conventions");
        return ok;
    - type: llm-rubric
      value: |-
        PASS if the Active Decisions entry is a concise rule statement.
        FAIL if the entry retells the conversation or explains the decision in narrative form.

        PASS example:
        ## Active Decisions
        - Validate outbound webhook payloads against the receiver's schema before sending.

        FAIL example:
        ## Active Decisions
        - After discussing webhook reliability, we decided to validate outbound payloads because third parties rejected them.
